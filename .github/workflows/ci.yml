name: CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    outputs:
      releases_worker: ${{ steps.filter.outputs.releases_worker }}
    steps:
      - name: Detect releases worker changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            releases_worker:
              - .github/workflows/ci.yml
              - .github/workflows/deploy-releases-worker.yml
              - rust-toolchain.toml
              - .nvmrc
              - bunfig.toml
              - package.json
              - bun.lock
              - workers/releases/**

  migrations:
    name: Released migrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Check released migrations
        run: node app/scripts/check-migrations.mjs

      - name: Test migration checker
        run: node --test app/scripts/check-migrations.test.mjs

  ts-lint:
    name: TypeScript and Vue lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Lint TypeScript and Vue
        run: bun run lint:ts

  ts-typecheck:
    name: TypeScript and Vue typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck TypeScript and Vue
        run: bun run check:ts

  rust-fmt:
    name: Rust app format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        run: rustup toolchain install

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  rust-check:
    name: Rust app check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        run: rustup toolchain install

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Cache Cargo app artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/crates/**/Cargo.toml') }}-${{ github.job }}
          restore-keys: |
            cargo-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/crates/**/Cargo.toml') }}-
            cargo-app-${{ runner.os }}-

      - name: Check Rust app
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --features dev-tools --locked

  rust-clippy:
    name: Rust app clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        run: rustup toolchain install

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Cache Cargo app artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/crates/**/Cargo.toml') }}-${{ github.job }}
          restore-keys: |
            cargo-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/crates/**/Cargo.toml') }}-
            cargo-app-${{ runner.os }}-

      - name: Lint Rust app
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features dev-tools --locked -- -D warnings

  rust-test:
    name: Rust app tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Rust
        run: rustup toolchain install

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Cache Cargo app artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/crates/**/Cargo.toml') }}-${{ github.job }}
          restore-keys: |
            cargo-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/crates/**/Cargo.toml') }}-
            cargo-app-${{ runner.os }}-

      - name: Test Rust app
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --features dev-tools --locked

  versions:
    name: Version sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check source versions
        run: bun run check:versions

  contracts:
    name: Contract drift
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Rust
        run: rustup toolchain install

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Cache Bun packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Cargo app artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/crates/**/Cargo.toml') }}-${{ github.job }}
          restore-keys: |
            cargo-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/crates/**/Cargo.toml') }}-
            cargo-app-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check generated contracts
        run: bun run check:contracts

  licenses:
    name: License policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Rust
        run: rustup toolchain install

      - name: Cache Bun packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Cargo metadata artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-licenses-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/crates/**/Cargo.toml') }}
          restore-keys: |
            cargo-licenses-${{ runner.os }}-
            cargo-app-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check release license policy
        run: bun run check:licenses:all

  releases-worker-fmt:
    name: Releases worker format
    needs: changes
    if: ${{ needs.changes.outputs.releases_worker == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        run: rustup toolchain install

      - name: Check releases worker Rust formatting
        run: cargo fmt --manifest-path workers/releases/Cargo.toml --all -- --check

  releases-worker-check:
    name: Releases worker check
    needs: changes
    if: ${{ needs.changes.outputs.releases_worker == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        run: rustup toolchain install

      - name: Add Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Cargo releases worker artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            workers/releases/target
          key: cargo-releases-worker-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'workers/releases/Cargo.lock', 'workers/releases/Cargo.toml') }}-${{ github.job }}
          restore-keys: |
            cargo-releases-worker-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'workers/releases/Cargo.lock', 'workers/releases/Cargo.toml') }}-
            cargo-releases-worker-${{ runner.os }}-

      - name: Check releases worker Rust
        run: cargo check --manifest-path workers/releases/Cargo.toml --target wasm32-unknown-unknown --locked

  releases-worker-clippy:
    name: Releases worker clippy
    needs: changes
    if: ${{ needs.changes.outputs.releases_worker == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        run: rustup toolchain install

      - name: Add Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Cargo releases worker artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            workers/releases/target
          key: cargo-releases-worker-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'workers/releases/Cargo.lock', 'workers/releases/Cargo.toml') }}-${{ github.job }}
          restore-keys: |
            cargo-releases-worker-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'workers/releases/Cargo.lock', 'workers/releases/Cargo.toml') }}-
            cargo-releases-worker-${{ runner.os }}-

      - name: Lint releases worker Rust
        run: cargo clippy --manifest-path workers/releases/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings

  releases-worker-test:
    name: Releases worker tests
    needs: changes
    if: ${{ needs.changes.outputs.releases_worker == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        run: rustup toolchain install

      - name: Cache Cargo releases worker artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            workers/releases/target
          key: cargo-releases-worker-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'workers/releases/Cargo.lock', 'workers/releases/Cargo.toml') }}-${{ github.job }}
          restore-keys: |
            cargo-releases-worker-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'workers/releases/Cargo.lock', 'workers/releases/Cargo.toml') }}-
            cargo-releases-worker-${{ runner.os }}-

      - name: Test releases worker Rust
        run: cargo test --manifest-path workers/releases/Cargo.toml --locked

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs:
      - changes
      - migrations
      - ts-lint
      - ts-typecheck
      - rust-fmt
      - rust-check
      - rust-clippy
      - rust-test
      - versions
      - contracts
      - licenses
      - releases-worker-fmt
      - releases-worker-check
      - releases-worker-clippy
      - releases-worker-test
    runs-on: ubuntu-24.04
    steps:
      - name: Check required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
          TS_LINT_RESULT: ${{ needs['ts-lint'].result }}
          TS_TYPECHECK_RESULT: ${{ needs['ts-typecheck'].result }}
          RUST_FMT_RESULT: ${{ needs['rust-fmt'].result }}
          RUST_CHECK_RESULT: ${{ needs['rust-check'].result }}
          RUST_CLIPPY_RESULT: ${{ needs['rust-clippy'].result }}
          RUST_TEST_RESULT: ${{ needs['rust-test'].result }}
          VERSIONS_RESULT: ${{ needs.versions.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          LICENSES_RESULT: ${{ needs.licenses.result }}
          RELEASES_WORKER_FMT_RESULT: ${{ needs['releases-worker-fmt'].result }}
          RELEASES_WORKER_CHECK_RESULT: ${{ needs['releases-worker-check'].result }}
          RELEASES_WORKER_CLIPPY_RESULT: ${{ needs['releases-worker-clippy'].result }}
          RELEASES_WORKER_TEST_RESULT: ${{ needs['releases-worker-test'].result }}
        shell: bash
        run: |
          set -euo pipefail

          failed=0

          check_success() {
            local name="$1"
            local result="$2"

            if [[ "$result" == "success" ]]; then
              return
            fi

            echo "${name} finished with result ${result}."
            failed=1
          }

          check_success "changes" "$CHANGES_RESULT"
          check_success "migrations" "$MIGRATIONS_RESULT"
          check_success "ts-lint" "$TS_LINT_RESULT"
          check_success "ts-typecheck" "$TS_TYPECHECK_RESULT"
          check_success "rust-fmt" "$RUST_FMT_RESULT"
          check_success "rust-check" "$RUST_CHECK_RESULT"
          check_success "rust-clippy" "$RUST_CLIPPY_RESULT"
          check_success "rust-test" "$RUST_TEST_RESULT"
          check_success "versions" "$VERSIONS_RESULT"
          check_success "contracts" "$CONTRACTS_RESULT"
          check_success "licenses" "$LICENSES_RESULT"

          check_optional() {
            local name="$1"
            local result="$2"

            if [[ "$result" == "success" || "$result" == "skipped" ]]; then
              return
            fi

            echo "${name} finished with result ${result}."
            failed=1
          }

          check_optional "releases-worker-fmt" "$RELEASES_WORKER_FMT_RESULT"
          check_optional "releases-worker-check" "$RELEASES_WORKER_CHECK_RESULT"
          check_optional "releases-worker-clippy" "$RELEASES_WORKER_CLIPPY_RESULT"
          check_optional "releases-worker-test" "$RELEASES_WORKER_TEST_RESULT"

          exit "$failed"
